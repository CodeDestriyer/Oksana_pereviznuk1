<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Генератор OG Image</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f0f0f0; font-family: Montserrat, sans-serif; margin: 0; }
        canvas { border: 1px solid #ccc; max-width: 90vw; }
        button { margin-top: 20px; padding: 16px 40px; font-size: 18px; font-weight: 700; background: #1a3a5e; color: white; border: none; border-radius: 12px; cursor: pointer; font-family: inherit; }
        button:hover { background: #0d1f3c; }
        p { color: #666; margin-top: 12px; font-size: 14px; }
    </style>
</head>
<body>
    <h2>OG Image Preview (1200×630)</h2>
    <canvas id="c" width="1200" height="630"></canvas>
    <button onclick="download()">⬇ Завантажити og-image.png</button>
    <p>Після завантаження — закинь файл на хостинг поруч з Pasanger_Oksi.html</p>

<script>
function draw() {
    var c = document.getElementById('c');
    var ctx = c.getContext('2d');
    var W = 1200, H = 630;

    // Фон — градієнт
    var grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, '#1a3a5e');
    grad.addColorStop(1, '#0d1f3c');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(0, 0, W, H, 0);
    ctx.fill();

    // Декоративні кола
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.beginPath(); ctx.arc(950, 100, 300, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(200, 550, 200, 0, Math.PI * 2); ctx.fill();

    // Лінія зверху
    ctx.fillStyle = '#d90d0d';
    ctx.fillRect(0, 0, W, 6);

    // Емодзі автобус
    ctx.font = '120px serif';
    ctx.textAlign = 'center';
    ctx.fillText('🚐', 600, 200);

    // Назва компанії
    ctx.fillStyle = 'white';
    ctx.font = '900 72px Montserrat, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('BORISPOL', 600, 330);

    ctx.fillStyle = '#d90d0d';
    ctx.font = '800 56px Montserrat, Arial, sans-serif';
    ctx.fillText('VIP TRAVEL', 600, 410);

    // Підпис
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '600 28px Montserrat, Arial, sans-serif';
    ctx.fillText('CRM Пасажири', 600, 500);

    // Лінія знизу
    ctx.fillStyle = '#d90d0d';
    ctx.fillRect(0, H - 6, W, 6);
}

function download() {
    var c = document.getElementById('c');
    var link = document.createElement('a');
    link.download = 'og-image.png';
    link.href = c.toDataURL('image/png');
    link.click();
}

// Чекаємо шрифт
document.fonts.ready.then(draw);
</script>
</body>
</html>
